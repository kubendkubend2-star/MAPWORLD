<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#b026ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" stroke="url(#cyberGrad)" stroke-width="3" fill="rgba(9, 12, 20, 0.7)" filter="url(#glow)" />
  <!-- Inner Circuit Lines -->
  <path d="M50 15 L50 35 M25 70 L40 55 M75 70 L60 55" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
  <!-- Game Controller D-pad Silhouette -->
  <path d="M45 42 H55 V47 H60 V53 H55 V58 H45 V53 H40 V47 H45 Z" fill="#00f3ff" />
  <!-- Core Energy Orb -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>
